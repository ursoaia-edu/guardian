version: "2"
sql:
  - engine: postgresql
    queries: db/queries
    schema: db/migrations
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          # Task 3's tenant.go (inAccount, Tenant) is fixed at
          # github.com/google/uuid.UUID for account/user ids, and this task's
          # own test passes generated row ids straight into inAccount. Without
          # this override sqlc's pgx/v5 default (pgtype.UUID) makes those two
          # already-committed pieces of code mutually incompatible.
          #
          # Both entries are required. sqlc matches an override only when its
          # `nullable` flag equals the column's nullability, and `nullable`
          # defaults to false — so the first entry covers NOT NULL columns
          # only. Without the second, a nullable uuid falls through to the
          # pgx/v5 default, which is pgtype.UUID regardless of nullability.
          # emit_pointers_for_null_types does not change this: it has no
          # effect on types the pgx/v5 driver branch handles itself.
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              type: "UUID"
              import: "github.com/google/uuid"
              pointer: true
          # computers.token_hash is the agent's credential digest. Handlers
          # return db.Computer straight to the cabinet, so without this tag the
          # digest ships in every computer response. Enforcing it on the
          # generated struct rather than in a hand-written DTO means a new
          # handler cannot forget it. TestComputerResponseHidesTheTokenHash is
          # the guard that the tag still applies after a regeneration.
          - column: "computers.token_hash"
            go_struct_tag: 'json:"-"'
          # sqlc maps jsonb to []byte, and encoding/json marshals a []byte field
          # as a base64 string — so without this every response ships
          # "hardware":"e30=" instead of "hardware":{}. json.RawMessage has the
          # same underlying type, so writes still accept a plain []byte, but it
          # marshals through as raw JSON. Both entries are needed for the same
          # reason as the uuid pair: an override matches only columns whose
          # nullability equals its `nullable` flag.
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type: "encoding/json.RawMessage"
