# The "one container + Postgres, Caddy in front" deploy from
# specs/2026-09-05-saas-design.md. Copy server.env to .env in this directory
# first and fill in every CHANGE_ME plus GUARDIAN_DOMAIN (the DNS name this
# host answers on — Caddy fetches a certificate for it, so ports 80 and 443
# must reach this machine from the internet). POSTGRES_OWNER_PASSWORD and
# GUARDIAN_APP_PASSWORD must match the passwords embedded in
# MIGRATE_DATABASE_URL and DATABASE_URL respectively. Then:
#
#   docker compose up -d --build
#
# Build the guardian-server binary first (GOARCH=amd64 server/build.sh for a
# typical x86-64 host; it copies the binary here) — the Dockerfile packages
# an already-built binary, it does not compile Go.
#
# The agent installer archive is not part of the image or of this file:
# without it "Install agent" in the cabinet answers 503. Build it with
# tools/mkinstaller, mount it into "server" and set INSTALLER_ARCHIVE to the
# mounted path — see INSTALLER_ARCHIVE in server.env.
#
# Named explicitly: docker compose otherwise derives the project name from
# this directory's basename, which is "server" — identical to
# server/docker-compose.dev.yml's default project name. Without this,
# running both from a checkout collides on container/volume names and one
# "docker compose down" can silently tear down the other's Postgres data.
name: guardian-server
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guardian_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      POSTGRES_DB: guardian
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates guardian_app on first init only — see db-init/01-roles.sh.
      # guardian_owner itself comes from POSTGRES_USER/POSTGRES_PASSWORD
      # above, which is the image's own bootstrap behaviour.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_owner -d guardian"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Runs once per "docker compose up" and exits 0; "server" below will not
  # start until it succeeds. The service's own role (guardian_app,
  # DATABASE_URL) cannot alter the schema at all — see specs/server.md's
  # Row-Level Security section — so this is the only thing here allowed to
  # run DDL, matching the deploy order server/build.sh documents.
  migrate:
    build: .
    command: ["guardian-server", "migrate"]
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build: .
    # Not published: only Caddy reaches it. Publishing 8080 would bypass TLS
    # and let a client hand the server its own X-Forwarded-For.
    expose:
      - "8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Exactly one proxy hop — Caddy — sits between the internet and this
      # process, whatever .env says for a bare-metal install.
      TRUSTED_PROXIES: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GUARDIAN_DOMAIN: ${GUARDIAN_DOMAIN:?set GUARDIAN_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
